platform: python
platformVersion: "3.12"
buildCommand: |
  set -e

  echo "==> Installing Node 20 (single-platform sandbox has no npm by default)"
  NODE_VERSION=20.18.1
  NODE_DIR=/tmp/node-v${NODE_VERSION}-linux-x64
  if [ ! -x "${NODE_DIR}/bin/node" ]; then
    curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz" -o /tmp/node.tar.xz
    tar -xJf /tmp/node.tar.xz -C /tmp
    rm -f /tmp/node.tar.xz
  fi
  export PATH="${NODE_DIR}/bin:${PATH}"
  node --version
  npm --version

  echo "==> Building UI"
  cd ui
  npm ci --no-audit --no-fund
  npm run build
  cd ..

  echo "==> Staging app to /output"
  mkdir -p /output
  cp -r app /output/app
  cp requirements.txt /output/requirements.txt
  mkdir -p /output/static
  cp -r ui/dist/* /output/static/

  echo "==> Creating Python venv"
  python3.12 -m venv /output/pythonenv3.12
  /output/pythonenv3.12/bin/pip install --no-cache-dir --upgrade pip
  /output/pythonenv3.12/bin/pip install --no-cache-dir -r /output/requirements.txt

autoDeploy: true

run:
  port: 8080
  startCommand: "/output/pythonenv3.12/bin/uvicorn app.main:app --host 0.0.0.0 --port 8080 --app-dir /output"

healthCheck:
  path: /health
  expectedStatusCode: 200
